<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1120">
<meta name="mobile-web-app-capable" content="yes">
<title>クチだけタイピング mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1120;
  --telop:#FFE14D;
  --hot:#FF3D7F;
  --cool:#35E0D8;
  --paper:#FFFFFF;
  --mute:#6E7699;
  --stroke:#000000;
  --safeB:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{
  background:radial-gradient(120% 70% at 50% 0%,#1E2549 0%,var(--ink) 60%),var(--ink);
  color:var(--paper);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button{font-family:inherit;border:none;cursor:pointer;}
#app{position:relative;height:100dvh;display:flex;flex-direction:column;}
.telop{
  font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  -webkit-text-stroke:4px var(--stroke);
  paint-order:stroke fill;
}

/* ---- HUD ---- */
#hud{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;
  border-bottom:1px solid rgba(255,255,255,.08);z-index:5;
}
.stat{display:flex;align-items:baseline;gap:5px;}
.stat .lbl{font-size:9px;letter-spacing:.14em;color:var(--mute);font-weight:700;}
.stat .val{font-family:"Roboto Mono",monospace;font-size:19px;font-weight:700;line-height:1;}
#comboS .val{color:var(--cool);}
#missS .val{color:var(--hot);}
.spacer{flex:1;}
.ghost{
  background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--mute);
  border-radius:999px;padding:6px 11px;font-size:11px;font-weight:700;
}
.ghost.on{border-color:var(--telop);color:var(--telop);}

/* ---- ステージ ---- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;}
#deadline{position:absolute;left:0;right:0;bottom:0;height:2px;
  background:repeating-linear-gradient(90deg,var(--hot) 0 12px,transparent 12px 24px);opacity:.6;}
.word{position:absolute;left:50%;top:0;transform:translate(-50%,0);
  width:94%;text-align:center;will-change:transform;}
.word .main{
  display:block;color:var(--telop);
  font-size:clamp(24px,7.4vw,44px);line-height:1.22;
  word-break:auto-phrase;overflow-wrap:anywhere;
  text-shadow:0 4px 0 rgba(0,0,0,.45);
}
.word .read{display:block;margin-top:4px;font-size:11px;font-weight:700;
  color:#B9C2E8;letter-spacing:.1em;-webkit-text-stroke:0;
  font-family:"Zen Kaku Gothic New",sans-serif;}
.word.near .main{color:var(--hot);}
.word.hit{animation:pop .32s ease-out forwards;}
@keyframes pop{
  0%{transform:translate(-50%,0) scale(1);}
  35%{transform:translate(-50%,0) scale(1.25);}
  100%{transform:translate(-50%,0) scale(1.8);opacity:0;}
}
#shake.shaking{animation:shk .28s;}
@keyframes shk{0%,100%{transform:translate(0,0);}25%{transform:translate(-7px,2px);}
  50%{transform:translate(6px,-3px);}75%{transform:translate(-4px,2px);}}
#burst{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-6deg);
  font-size:clamp(38px,13vw,74px);pointer-events:none;opacity:0;}
#burst.show{animation:burst .5s ease-out;}
@keyframes burst{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(.5);}
  20%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1.15);}
  70%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(1.05);}
}

/* ---- 認識バー ---- */
#mic{flex:0 0 auto;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.7));
  border-top:1px solid rgba(255,255,255,.1);padding:9px 12px;z-index:5;}
#micTop{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
#dot{width:9px;height:9px;border-radius:50%;background:var(--mute);}
#dot.live{background:var(--hot);animation:pulse 1.1s infinite;}
@keyframes pulse{50%{opacity:.25;}}
#micLabel{font-size:9px;letter-spacing:.16em;color:var(--mute);font-weight:700;}
#resume{margin-left:auto;background:var(--hot);color:#fff;border-radius:999px;
  padding:5px 13px;font-size:11px;font-weight:900;display:none;}
#resume.show{display:block;}
#heard{min-height:38px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(17px,5.4vw,28px);color:var(--paper);-webkit-text-stroke:3.5px var(--stroke);
  text-align:center;word-break:break-all;}
#heard.interim{color:#95A0CC;}
#heard .empty{font-size:12px;color:var(--mute);-webkit-text-stroke:0;font-weight:700;
  font-family:"Zen Kaku Gothic New",sans-serif;letter-spacing:.08em;}

/* ---- 聞き間違いログ（下部・横並び） ---- */
#log{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:7px 12px calc(7px + var(--safeB));background:rgba(0,0,0,.5);
  border-top:1px solid rgba(255,255,255,.07);}
#log::-webkit-scrollbar{display:none;}
#log:empty{display:none;}
.logItem{flex:0 0 auto;background:rgba(255,255,255,.06);border-left:3px solid var(--hot);
  padding:5px 9px;border-radius:0 6px 6px 0;font-size:11px;line-height:1.45;max-width:60vw;
  animation:slideIn .22s ease-out;}
.logItem b{color:var(--telop);font-weight:900;display:block;}
.logItem span{color:#8A93BB;}
@keyframes slideIn{from{opacity:0;transform:translateY(8px);}}
body.clean #log{display:none;}
body.clean #typeRow{display:none;}

#typeRow{padding:0 12px 8px;display:flex;justify-content:center;}
#typeIn{width:100%;max-width:420px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:8px;
  padding:9px 11px;font-size:16px;font-family:inherit;font-weight:700;}
#typeIn:focus{outline:none;border-color:var(--cool);}

/* ---- オーバーレイ ---- */
.screen{position:absolute;inset:0;z-index:20;background:rgba(9,11,22,.96);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:16px;padding:calc(env(safe-area-inset-top,0px) + 26px) 18px calc(26px + var(--safeB));
  text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen.hide{display:none;}
h1{font-family:"Dela Gothic One",sans-serif;font-size:clamp(30px,10vw,52px);line-height:1.1;
  color:var(--telop);-webkit-text-stroke:6px var(--stroke);paint-order:stroke fill;
  transform:rotate(-2.5deg);margin-top:6px;}
h1 em{font-style:normal;color:var(--hot);}
.sub{font-size:13px;color:#A8B0D6;line-height:1.8;max-width:420px;font-weight:500;}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;}
.mode{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);
  color:#fff;border-radius:12px;padding:12px 10px;text-align:left;}
.mode .mt{font-size:15px;font-weight:900;display:block;}
.mode .md{font-size:10px;color:var(--mute);display:block;margin-top:2px;font-weight:700;}
.start{background:var(--hot);color:#fff;border-radius:999px;padding:16px 44px;
  font-size:19px;font-weight:900;letter-spacing:.05em;box-shadow:0 5px 0 #A5164B;}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 #A5164B;}
.warn{font-size:11px;color:#FFAF4D;max-width:400px;line-height:1.7;font-weight:700;}
.results{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;}
.results div{display:flex;flex-direction:column;gap:3px;}
.results .rv{font-family:"Roboto Mono",monospace;font-size:32px;font-weight:700;color:var(--telop);}
.results .rl{font-size:9px;letter-spacing:.14em;color:var(--mute);font-weight:700;}
#quotes{width:100%;max-width:440px;display:flex;flex-direction:column;gap:6px;}
#quotes h3{font-size:11px;letter-spacing:.18em;color:var(--cool);font-weight:900;}
.quote{background:rgba(255,255,255,.05);border-radius:8px;padding:9px 11px;
  text-align:left;font-size:13px;}
.quote .q1{color:#8A93BB;font-weight:700;display:block;font-size:11px;}
.quote .q2{color:var(--telop);font-weight:900;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
@media (orientation:landscape) and (max-height:520px){
  .word .main{font-size:clamp(20px,4.4vw,34px);}
  #heard{font-size:20px;min-height:30px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><span class="lbl">SCORE</span><span class="val" id="scoreV">0</span></div>
    <div class="stat" id="comboS"><span class="lbl">COMBO</span><span class="val" id="comboV">0</span></div>
    <div class="stat" id="missS"><span class="lbl">MISS</span><span class="val" id="missV">0/5</span></div>
    <div class="spacer"></div>
    <button class="ghost" id="cleanBtn">配信</button>
    <button class="ghost" id="quitBtn">やめる</button>
  </div>

  <div id="stage">
    <div id="shake" style="position:absolute;inset:0;">
      <div id="words"></div>
      <div class="telop" id="burst"></div>
    </div>
    <div id="deadline"></div>
  </div>

  <div id="mic">
    <div id="micTop">
      <div id="dot"></div>
      <div id="micLabel">聞こえた言葉</div>
      <button id="resume">タップで再開</button>
    </div>
    <div class="telop" id="heard"><span class="empty">マイクを待っています…</span></div>
  </div>
  <div id="typeRow"><input id="typeIn" placeholder="手入力でも判定できます" autocomplete="off" autocapitalize="off"></div>
  <div id="log"></div>

  <div class="screen" id="title">
    <h1>クチだけ<br><em>タイピング</em></h1>
    <p class="sub">降ってくる言葉を、声に出して読むだけ。<br>判定するのは音声認識なので、滑舌が全てです。</p>
    <div class="modes" id="modeList"></div>
    <button class="start" id="startBtn">はじめる</button>
    <p class="warn" id="warnMsg"></p>
  </div>

  <div class="screen hide" id="over">
    <h1 id="overTitle">おわり</h1>
    <div class="results">
      <div><span class="rv" id="fScore">0</span><span class="rl">SCORE</span></div>
      <div><span class="rv" id="fCombo">0</span><span class="rl">MAX COMBO</span></div>
      <div><span class="rv" id="fRate">0%</span><span class="rl">成功率</span></div>
    </div>
    <div id="quotes"></div>
    <button class="start" id="againBtn">もう一回</button>
  </div>
</div>

<script>
"use strict";

/* ===== お題 ===== */
const PA="ぱぴぷぺぽばびぶべぼ";
function genPa(){
  const n=4+Math.floor(Math.random()*2);
  let s="";for(let i=0;i<n;i++) s+=PA[Math.floor(Math.random()*PA.length)];
  return {text:s,read:s};
}
const DECKS={
  normal:{name:"ウォームアップ",desc:"ふつうの単語",tol:.62,
    words:"りんご/せんぷうき/かいだんのぼり/とうもろこし/しんかんせん/たいようけい/でんしゃにのる/こんにちは/ありがとう/おにぎり/かたつむり/じてんしゃ/たまごやき/えんぴつけずり"
      .split("/").map(w=>({text:w,read:w}))},
  tongue:{name:"早口言葉",desc:"噛んだら終わり",tol:.60,words:[
    ["生麦生米生卵","なまむぎなまごめなまたまご"],
    ["東京特許許可局","とうきょうとっきょきょかきょく"],
    ["赤巻紙青巻紙","あかまきがみあおまきがみ"],
    ["隣の客はよく柿食う客だ","となりのきゃくはよくかきくうきゃくだ"],
    ["バスガス爆発","ばすがすばくはつ"],
    ["竹垣に竹立てかけた","たけがきにたけたてかけた"],
    ["新春シャンソンショー","しんしゅんしゃんそんしょー"],
    ["骨粗鬆症","こつそしょうしょう"],
    ["老若男女","ろうにゃくなんにょ"],
    ["除雪車除雪作業中","じょせつしゃじょせつさぎょうちゅう"],
    ["特急券特売中","とっきゅうけんとくばいちゅう"],
    ["この寿司は少し酢が利きすぎた","このすしはすこしすがききすぎた"],
    ["マサチューセッツ州","まさちゅーせっつしゅう"],
    ["書写山の社僧正","しょしゃざんのしゃそうじょう"]
  ].map(p=>({text:p[0],read:p[1]}))},
  papi:{name:"ぱぴぷぺぽ",desc:"認識が壊れる",tol:.46,gen:genPa,words:[]},
  dialect:{name:"方言",desc:"訛りが試される",tol:.58,
    words:"なんしよーと/とっとーと/どげんかせんといかん/なまらうまいっしょ/めんこいねぇ/ほんまでっか/そうじゃけぇ/だからよー/おきばりやす/わやくちゃ/ばりうまか/きのどくな/たいぎいのう/ちかっぱすごい"
      .split("/").map(w=>({text:w,read:w}))},
  shout:{name:"全力宣言",desc:"配信で言うと恥ずかしい",tol:.60,
    words:"ぼくはてんさいです/きょうのわたしはさいきょう/だいすきだいすきだいすき/ちょーかっこいい/おなかがすいてしにそう/ゆるしてください/おかあさんありがとう/ぼくがうちゅういちだ/せかいへいわ/わたしがナンバーワン"
      .split("/").map(w=>({text:w,read:w}))},
  mix:{name:"ぜんぶ",desc:"闇鍋",tol:.56,words:[],mix:true}
};

/* ===== 正規化 ===== */
const SMALL={"ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","ゃ":"や","ゅ":"ゆ","ょ":"よ","っ":"つ","ゎ":"わ"};
function norm(s){
  if(!s) return "";
  s=s.trim().replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  s=s.replace(/[ー〜、。！？!?,.\s・「」]/g,"");
  return s.replace(/[ぁぃぅぇぉゃゅょっゎ]/g,c=>SMALL[c]);
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    const t=prev;prev=cur;cur=t;
  }
  return prev[n];
}
function sim(a,b){
  a=norm(a);b=norm(b);
  if(!a||!b) return 0;
  return 1-lev(a,b)/Math.max(a.length,b.length);
}
function score(heard,w){
  const h=norm(heard),r=norm(w.read);
  if(r.length>=4&&h.includes(r)) return 1;
  return Math.max(sim(heard,w.read),sim(heard,w.text));
}

/* ===== 状態 ===== */
const G={running:false,deck:"tongue",words:[],score:0,combo:0,maxCombo:0,
  miss:0,maxMiss:5,hits:0,spawned:0,t:0,lastSpawn:0,quotes:[],raf:0};
const $=id=>document.getElementById(id);
const wordsEl=$("words"),stageEl=$("stage"),logEl=$("log");
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||
  (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

/* ===== 音 ===== */
let AC=null;
function unlockAudio(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
  }catch(e){}
}
function beep(f,d,t,v){
  try{
    if(!AC) return;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=t||"square";o.frequency.value=f;
    g.gain.setValueAtTime(v||.14,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
const sHit=c=>beep(660+Math.min(c,12)*45,.09,"square",.13);
const sMiss=()=>{beep(180,.22,"sawtooth",.14);setTimeout(()=>beep(120,.28,"sawtooth",.12),90);};
function vib(ms){ if(navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} }

/* ===== 画面スリープ防止 ===== */
let wakeLock=null;
async function keepAwake(){
  try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseAwake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&G.running) keepAwake();
});

/* ===== 音声認識 ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recWant=false,restarts=0,lastStart=0;

function initRec(){
  if(!SR) return false;
  rec=new SR();
  rec.lang="ja-JP";
  rec.continuous=!isIOS;      // iOSはcontinuousが不安定なので単発+自動再開
  rec.interimResults=true;
  rec.maxAlternatives=3;
  rec.onstart=()=>{ $("dot").classList.add("live"); $("resume").classList.remove("show"); };
  rec.onend=()=>{
    $("dot").classList.remove("live");
    if(!recWant) return;
    const gap=Date.now()-lastStart;
    if(gap<400) restarts++; else restarts=0;
    if(restarts>6){ $("resume").classList.add("show"); return; }  // 暴走防止
    setTimeout(safeStart,isIOS?120:250);
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      recWant=false;
      showHeard("マイクが使えません。手入力で遊べます",false,true);
    }else if(e.error==="no-speech"||e.error==="aborted"){
      /* 自動再開に任せる */
    }else{
      $("resume").classList.add("show");
    }
  };
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i],alts=[];
      for(let k=0;k<r.length;k++) alts.push(r[k].transcript);
      showHeard(alts[0],!r.isFinal,false);
      judge(alts,r.isFinal);
    }
  };
  return true;
}
function safeStart(){
  if(!rec||!recWant) return;
  lastStart=Date.now();
  try{ rec.start(); }catch(e){}
}
function startRec(){ recWant=true; restarts=0; safeStart(); }
function stopRec(){ recWant=false; if(rec) try{ rec.stop(); }catch(e){} }
$("resume").onclick=()=>{ restarts=0; recWant=true; safeStart(); };

function showHeard(t,interim,plain){
  const h=$("heard");
  h.classList.toggle("interim",!!interim);
  if(plain){ h.innerHTML='<span class="empty">'+esc(t)+'</span>'; return; }
  h.textContent=t||"";
}

/* ===== 判定 ===== */
function judge(alts,isFinal){
  if(!G.running) return;
  let best=null,bestS=0;
  const tol=DECKS[G.deck].tol;
  for(const w of G.words){
    if(w.dead) continue;
    for(const a of alts){
      const s=score(a,w);
      if(s>bestS){ bestS=s; best=w; }
    }
  }
  if(best&&bestS>=tol){ hit(best); return; }
  if(isFinal&&alts[0]&&G.words.length){
    const target=G.words.find(w=>!w.dead);
    if(target&&norm(alts[0]).length>1) addQuote(target,alts[0]);
  }
}
function addQuote(target,heard){
  G.quotes.push({say:target.text,heard:heard});
  const d=document.createElement("div");
  d.className="logItem";
  d.innerHTML='<span>'+esc(target.text)+'</span><b>'+esc(heard)+'</b>';
  logEl.prepend(d);
  while(logEl.children.length>6) logEl.lastChild.remove();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function hit(w){
  w.dead=true;G.hits++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  G.score+=100+G.combo*20+Math.floor(w.el.dist*80);
  w.el.node.classList.add("hit");
  sHit(G.combo);vib(20);
  burst(G.combo>=5?"×"+G.combo:"OK!","var(--cool)");
  setTimeout(()=>w.el.node.remove(),330);
  G.words=G.words.filter(x=>x!==w);
  updateHUD();
}
function miss(w){
  G.miss++;G.combo=0;
  sMiss();vib([40,50,40]);
  burst("ムリ","var(--hot)");
  $("shake").classList.add("shaking");
  setTimeout(()=>$("shake").classList.remove("shaking"),280);
  w.el.node.remove();
  G.words=G.words.filter(x=>x!==w);
  updateHUD();
  if(G.miss>=G.maxMiss) gameOver();
}
function burst(t,c){
  const b=$("burst");
  b.textContent=t;b.style.color=c;
  b.classList.remove("show");void b.offsetWidth;b.classList.add("show");
}
function updateHUD(){
  $("scoreV").textContent=G.score;
  $("comboV").textContent=G.combo;
  $("missV").textContent=G.miss+"/"+G.maxMiss;
}

/* ===== 出題 ===== */
function pickWord(){
  const d=DECKS[G.deck];
  if(d.gen) return d.gen();
  if(d.mix){
    const keys=["normal","tongue","papi","dialect","shout"];
    const dd=DECKS[keys[Math.floor(Math.random()*keys.length)]];
    return dd.gen?dd.gen():dd.words[Math.floor(Math.random()*dd.words.length)];
  }
  return d.words[Math.floor(Math.random()*d.words.length)];
}
function spawn(){
  const src=pickWord();
  const w={text:src.text,read:src.read,dead:false};
  const node=document.createElement("div");
  node.className="word telop";
  node.innerHTML='<span class="main">'+esc(src.text)+'</span>'+
    (src.text!==src.read?'<span class="read">'+esc(src.read)+'</span>':'');
  wordsEl.appendChild(node);
  w.el={node:node,dist:0,speed:fallSpeed()};
  G.words.push(w);G.spawned++;
}
function level(){ return Math.min(9,Math.floor(G.hits/5)); }
function fallSpeed(){ return 0.072+level()*0.011; }
function spawnGap(){ return Math.max(2200,4200-level()*220); }

/* ===== ループ ===== */
let lastT=0;
function loop(ts){
  if(!G.running) return;
  const dt=lastT?Math.min(64,ts-lastT):16;
  lastT=ts;G.t+=dt;
  if(G.t-G.lastSpawn>spawnGap()||G.words.length===0){ G.lastSpawn=G.t; spawn(); }
  const H=stageEl.clientHeight;
  for(const w of [...G.words]){
    w.el.dist+=w.el.speed*dt/1000;
    const y=w.el.dist*(H-70);
    w.el.node.style.transform="translate(-50%,"+y+"px)";
    if(w.el.dist>0.72) w.el.node.classList.add("near");
    if(w.el.dist>=1) miss(w);
  }
  G.raf=requestAnimationFrame(loop);
}

/* ===== 進行 ===== */
function startGame(){
  unlockAudio();keepAwake();
  G.running=true;G.score=0;G.combo=0;G.maxCombo=0;G.miss=0;
  G.hits=0;G.spawned=0;G.t=0;G.lastSpawn=-9999;G.quotes=[];lastT=0;
  G.words.forEach(w=>w.el.node.remove());G.words=[];
  logEl.innerHTML="";updateHUD();
  showHeard("さあ、読んで",false,true);
  $("title").classList.add("hide");$("over").classList.add("hide");
  startRec();beep(880,.08,"square",.1);
  G.raf=requestAnimationFrame(loop);
}
function gameOver(){
  G.running=false;cancelAnimationFrame(G.raf);stopRec();releaseAwake();
  G.words.forEach(w=>w.el.node.remove());G.words=[];
  $("fScore").textContent=G.score;
  $("fCombo").textContent=G.maxCombo;
  const rate=G.spawned?Math.round(G.hits/G.spawned*100):0;
  $("fRate").textContent=rate+"%";
  $("overTitle").textContent=rate>=80?"滑舌の鬼":rate>=50?"まあまあ":"何言ってるか分からん";
  const list=G.quotes.slice(-8).reverse();
  $("quotes").innerHTML=list.length
    ?'<h3>本日の聞き間違い</h3>'+list.map(x=>
      '<div class="quote"><span class="q1">'+esc(x.say)+' →</span><span class="q2">'+esc(x.heard)+'</span></div>').join("")
    :'';
  $("over").classList.remove("hide");
  beep(300,.3,"sawtooth",.12);
}
function quit(){
  G.running=false;cancelAnimationFrame(G.raf);stopRec();releaseAwake();
  G.words.forEach(w=>w.el.node.remove());G.words=[];
  $("title").classList.remove("hide");$("over").classList.add("hide");
}

/* ===== UI ===== */
(function(){
  const wrap=$("modeList");
  Object.keys(DECKS).forEach(k=>{
    const b=document.createElement("button");
    b.className="mode";
    b.innerHTML='<span class="mt">'+DECKS[k].name+'</span><span class="md">'+DECKS[k].desc+'</span>';
    if(k===G.deck) b.style.borderColor="var(--telop)";
    b.onclick=()=>{
      G.deck=k;unlockAudio();
      [...wrap.children].forEach(c=>c.style.borderColor="");
      b.style.borderColor="var(--telop)";
    };
    wrap.appendChild(b);
  });
})();
$("startBtn").onclick=startGame;
$("againBtn").onclick=startGame;
$("quitBtn").onclick=quit;
$("cleanBtn").onclick=e=>{
  document.body.classList.toggle("clean");
  e.currentTarget.classList.toggle("on");
};
$("typeIn").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const v=e.target.value.trim();e.target.value="";
  if(!v) return;
  showHeard(v,false,false);judge([v],true);
  e.target.blur();
});
document.addEventListener("touchstart",unlockAudio,{once:true});

/* ===== 起動チェック ===== */
(function(){
  const ok=initRec(),warn=$("warnMsg");
  if(!ok){
    warn.textContent="このブラウザは音声認識に非対応です。Android は Chrome、iPhone は Safari を使ってください（手入力でも遊べます）。";
  }else if(location.protocol==="file:"){
    warn.textContent="ファイルを直接開いた状態ではマイクが使えません。https のURLから開いてください。";
  }else if(isIOS){
    warn.textContent="iPhone は認識が数秒で切れることがあります。止まったら「タップで再開」を押してください。";
  }else{
    warn.textContent="マイクの許可を求められたら「許可」を押してください。";
  }
})();
</script>
